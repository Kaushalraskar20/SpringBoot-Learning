
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Student Records</title>
</head>

<body>

    <h2>All Students</h2>

    <table border="1" cellpadding="8">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Image</th>
        </tr>

        <tr th:each="student : ${students}">

            <td th:text="${student.id}"></td>

            <td th:text="${student.name}"></td>

            <td th:text="${student.email}"></td>
			
			
			
            <td>
                <img th:if="${student.imagePath != null}"
                     th:src="@{'/uploads/' + ${student.imagePath}}"
                     width="100"
                     height="100"
                     alt="Student Image">
            </td>

        </tr>

    </table>

</body>

</html>
