<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Users</title>
</head>

<body>

<h2 th:if="${user != null}">User Details</h2>

<form th:if="${user != null}" th:action="@{/users/update}" method="post">

    <input type="hidden" name="userid" th:value="${user.userid}" />

    <label>Name:</label>
    <input type="text" name="name" th:value="${user.name}" />

    <br/>

    <label>Email:</label>
    <input type="text" name="email" th:value="${user.email}" />

    <br/>

    <button type="submit">Update</button>

</form>

<hr/>

<h2>All Students</h2>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Action</th>
    </tr>

    <tr th:each="user : ${users}">

        <td th:text="${user.userid}"></td>

        <td th:text="${user.name}"></td>

        <td th:text="${user.email}"></td>

        <td>

            <a th:href="@{/users/{id}(id=${user.userid})}">
                Edit
            </a>

            <form th:action="@{/users/delete}" method="post" style="display:inline;">

                <input type="hidden"
                       name="userid"
                       th:value="${user.userid}" />

                <button type="submit">Delete</button>

            </form>

        </td>

    </tr>

</table>

</body>

</html>
